<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Crud  Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h1>JavaScript First Application</h1>
    <form id="create-form">
        <input type="text" id="name" name="name" placeholder="Name">
        <input type="number" id="age" name="age" placeholder="Age">
        <button id="create-btn">Create</button>
    </form>
    <table id="data-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
    </table>
</div>
<script>
let data = [
    { id: 1, name: "Pawan Yadav", age: 30 },
    { id: 2, name: "Asvin Jaswal", age: 37 },
    { id: 3, name: "Deepak Singh", age: 40 }
];

// Function to display data in table
function displayData() {
    const tableBody = document.getElementById("table-body");
    tableBody.innerHTML = "";
    data.forEach((item) => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td style="width: 5%;">${item.id}</td>
            <td>${item.name}</td>
            <td style="width: 11%;">${item.age}</td>
            <td style="width: 11%;">
                <button class="edit-btn" data-id="${item.id}">Edit</button>
                <button class="delete-btn" data-id="${item.id}">Delete</button>
            </td>
        `;
        tableBody.appendChild(row);
    });
}


</script>
<script>
// Create Data
function createData(name, age) {
    const newObj = { id: data.length + 1, name, age };
    data.push(newObj);
    displayData();
	name='';
	age='';
	
	
}

// Function to update data
function updateData(id, name, age) {
    const index = data.findIndex((item) => item.id === id);
    if (index !== -1) {
        data[index] = { id, name, age };
        displayData();
    }
}

// Function to delete data
function deleteData(id) {
    const index = data.findIndex((item) => item.id === id);
    if (index !== -1) {
        data.splice(index, 1);
        displayData();
    }
}


document.getElementById("create-btn").addEventListener("click", (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value;
    const age = document.getElementById("age").value;
    createData(name, age);
});

document.addEventListener("click", (e) => {

    if (e.target.classList.contains("edit-btn")) {
        const id = e.target.dataset.id;
        const item = data.find((item) => item.id === parseInt(id));
        const nameInput = document.getElementById("name");
        const ageInput = document.getElementById("age");
        nameInput.value = item.name;
        ageInput.value = item.age;
		
        document.getElementById("create-btn").innerHTML = "Update";
        document.getElementById("create-btn").addEventListener("click", (e) => {
            e.preventDefault();
            const name = nameInput.value;
            const age = ageInput.value;
            updateData(parseInt(id), name, age);
            document.getElementById("create-btn").innerHTML = "Create";
        });
    } else if (e.target.classList.contains("delete-btn")) {
        const id = e.target.dataset.id;
        deleteData(parseInt(id));
    }
});

displayData();
</script>

</body>
</html>

    font-family: Arial, sans-serif;

	padding:10px;
